<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    body, input{
      box-sizing: border-box;
    }
    .user-list{
      gap: 20px;
    }
    .user-list li{
      margin: 10px 0;
      border: 1px solid #ddd;
      border-radius: 5px;
      padding: 10px;
    }
    .msg-form{
      display: flex;
      flex-direction: column;
    }
    textarea{
      padding: 10px;
      margin-bottom: 10px;
    }
    .msg-input{
      margin: 10px 0;
      padding: 10px;
      border: 1px solid #ddd;
      height: 30px;
      width: 100%;
    }
  </style>
</head>
<body>
  <h1>Agent</h1>
  <form id="userForm">
    <input type="text" name="" id="username" placeholder="Enter username...">
    <input type="submit" value="Join To Chat">
  </form>

  <div id="userList" class="user-list"></div>


  <dialog  id="dialog">
    <form id="msgForm" class="msg-form">
      <textarea name="" id="msgList" cols="30" rows="20" readonly></textarea>
      <input id="msgInput" class="msg-input" />
      <input type="submit" name="" value="Send Message">
    </form>
  </dialog>
  <script src="/socket.io/socket.io.js"></script>
  <script src="http://localhost:4001/widget.js"></script>
</body>
</html>
