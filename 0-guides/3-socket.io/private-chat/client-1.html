<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body,
      input {
        box-sizing: border-box;
      }
      .user-list {
        gap: 20px;
      }
      .user-list li {
        margin: 10px 0;
        border: 1px solid #ddd;
        border-radius: 5px;
        padding: 10px;
      }
      .msg-form {
        display: flex;
        flex-direction: column;
      }
      .msg-list {
        display: flex;
        flex-direction: column;
        min-height: 300px;
        padding: 10px;
        border: 1px solid #ddd;
      }
      .msg-input {
        margin: 10px 0;
        padding: 10px;
        border: 1px solid #ddd;
        height: 30px;
        width: 100%;
      }
      .message {
        max-width: 70%;
        padding: 8px 12px;
        border-radius: 12px;
        margin: 4px 0;
        list-style: none;
        word-wrap: break-word;
      }

      .sent {
        background-color: #007bff;
        color: white;
        margin-left: auto; /* sağa yasla */
        text-align: right;
      }

      .received {
        background-color: #e5e5ea;
        color: black;
        margin-right: auto; /* sola yasla */
        text-align: left;
      }
    </style>
  </head>
  <body>
    <h1 id="userTitle"></h1>
    <form id="userForm">
      <input
        type="text"
        name=""
        id="userInput"
        placeholder="Enter username..."
      />
      <input type="submit" value="Join To Chat" />
    </form>

    <div id="userList" class="user-list"></div>

    <dialog id="dialog">
      <form id="msgForm" class="msg-form">
        <h3 id="title"></h3>
        <div id="msgList" class="msg-list"></div>
        <input id="msgInput" class="msg-input" />
        <input type="submit" name="" value="Send Message" />
      </form>
    </dialog>
    <script src="http://localhost:4001/socket.io/socket.io.js"></script>
    <script
      src="http://localhost:4001/widget.js"
      data-apikey="mestokaya"
    ></script>
  </body>
</html>
