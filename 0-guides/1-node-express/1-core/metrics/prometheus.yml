👉 sudo apt install prometheus
👉 sudo nano /etc/prometheus/prometheus.yml

global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "nodejs_app"
    static_configs:
      - targets: ["localhost:4000"]

  - job_name: "node"
    static_configs:
      - targets: ["localhost:9100"]
